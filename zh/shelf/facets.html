<div class="layout">

  <main class="content">
    <h1>目录、分类与标签</h1>

    <p class="lead">书架左侧的目录树有三个来源，用来快速把书库缩小到你要找的范围。</p>

    <img src="img/facets-1.png" alt="左侧目录树" loading="lazy">

    <h2>三类入口</h2>
    <table>
      <thead>
        <tr><th>入口</th><th>说明</th></tr>
      </thead>
      <tbody>
        <tr><td>来源</td><td>书来自哪个书库或目录</td></tr>
        <tr><td>分类</td><td>按主题归类，由站点或你自己维护</td></tr>
        <tr><td>标签</td><td>更灵活的关键词，一本书可以有多个</td></tr>
      </tbody>
    </table>

    <h2>筛选</h2>
    <ol>
      <li>展开左侧目录树，点开对应的分类或标签。</li>
      <li>书架只显示属于该项的书，顶栏会提示当前的筛选条件与数量。</li>
      <li>要取消筛选，点顶栏筛选条件旁的 ×，或回到「全部」。</li>
    </ol>

    <h2>配合搜索</h2>
    <p>在某一分类或标签下使用搜索框，只会在当前范围内查找。</p>

      <li><a href="upload.html">上传书籍</a></li>
    </ul>
  </main>
