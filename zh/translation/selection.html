    <h1>划词翻译</h1>

    <p class="lead">只想弄懂一句话或一段话时，不用开启整书翻译。</p>

    <h2>怎么用</h2>
    <ol>
      <li>在正文里选中要翻译的文字。</li>
      <li>在弹出菜单里点「翻译」。</li>
      <li>译文会立刻显示出来。</li>
    </ol>

    <img src="img/selection-1.png" alt="划词翻译结果" loading="lazy">

    <h2>字数上限</h2>
    <p>一次最多翻译 4000 个字符。超出时会在本地直接提示，不会发起请求；需要更长的话请分次选中，或改用整章翻译。</p>

    <h2>与整书翻译的区别</h2>
    <table>
      <thead>
        <tr><th></th><th>划词翻译</th><th>整书翻译</th></tr>
      </thead>
      <tbody>
        <tr><td>范围</td><td>你选中的那一段</td><td>跟随阅读 / 当前章 / 整书</td></tr>
        <tr><td>是否保留</td><td>临时结果，不写进书里</td><td>译好后随书显示</td></tr>
        <tr><td>适合</td><td>查一句话、看生词</td><td>整段、整章、整本地读</td></tr>
      </tbody>
    </table>
