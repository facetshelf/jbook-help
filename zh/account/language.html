    <h1>界面语言</h1>

    <p class="lead">界面语言只影响按钮、提示这些站点文案，不影响书籍内容。</p>

    <h2>支持的语言</h2>
    <p>简体中文、繁體中文、English、日本語、한국어、Deutsch、Español、Français。</p>

    <h2>切换</h2>
    <ol>
      <li>在阅读设置面板里找到「界面语言」分区；登录页与落地页上也有语言选择入口。</li>
      <li>选择语言后，界面文案立即切换。</li>
      <li>刷新后仍保持你选择的语言。</li>
    </ol>

    <h2>三个概念不要混</h2>
    <table>
      <thead>
        <tr><th>概念</th><th>影响什么</th></tr>
      </thead>
      <tbody>
        <tr><td>界面语言</td><td>按钮、菜单、提示等站点文案</td></tr>
        <tr><td>书的语言</td><td>书本身的内容，不会被界面语言改变</td></tr>
        <tr><td>翻译目标语言</td><td>AI 翻译把书译成哪种语言</td></tr>
      </tbody>
    </table>
